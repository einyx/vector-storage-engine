services:
  minio:
    image: minio/minio:latest
    container_name: enc-test-minio
    ports:
      - "9100:9000"
      - "9101:9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data

  warp-storage-engine:
    build:
      context: .
      dockerfile: Dockerfile.encryption-test
    container_name: enc-test-engine
    depends_on:
      - minio
    ports:
      - "8090:8080"
    environment:
      - STORAGE_PROVIDER=s3
      - S3_ENDPOINT=http://minio:9000
      - S3_ACCESS_KEY=minioadmin
      - S3_SECRET_KEY=minioadmin
      - S3_REGION=us-east-1
      - S3_PATH_STYLE=true
      - AUTH_TYPE=basic
      - AUTH_IDENTITY=admin
      - AUTH_CREDENTIAL=secret
      - ENCRYPTION_ENABLED=true
      - ENCRYPTION_KEY_PROVIDER=local
      - ENCRYPTION_ALGORITHM=AES-256-GCM
      - ENCRYPTION_LOCAL_MASTER_KEY=${ENCRYPTION_LOCAL_MASTER_KEY}
      - LOG_LEVEL=debug
      - LOG_FORMAT=json
    volumes:
      - ./config.encryption-test.yaml:/etc/warp-storage-engine/warp-storage-engine.yaml:ro
    command:
      - "--config"
      - "/etc/warp-storage-engine/warp-storage-engine.yaml"

volumes:
  minio-data:
