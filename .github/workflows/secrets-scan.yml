name: Secrets Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Run daily at 2 AM UTC
    - cron: '0 2 * * *'

jobs:
  trufflehog:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch all history for better detection

      - name: TruffleHog OSS Scan (PR)
        if: github.event_name == 'pull_request'
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/repo" -w /repo \
            trufflesecurity/trufflehog:3.99.7 git file:///repo --only-verified \
            --since-commit "${{ github.event.pull_request.base.sha }}"

      - name: TruffleHog OSS Scan (Full)
        if: github.event_name != 'pull_request'
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/repo" -w /repo \
            trufflesecurity/trufflehog:3.99.7 git file:///repo --only-verified


  detect-secrets:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Install detect-secrets
        run: |
          python3 -m venv .venv-secrets
          .venv-secrets/bin/pip install --quiet detect-secrets
          echo "$PWD/.venv-secrets/bin" >> $GITHUB_PATH

      - name: Run detect-secrets
        run: |
          detect-secrets scan --all-files --force-use-all-plugins > .secrets.new

      - name: Compare with baseline
        run: |
          if [ -f .secrets.baseline ]; then
            # Use non-interactive mode with JSON output
            detect-secrets audit --report .secrets.baseline .secrets.new || echo "No new secrets detected"
          else
            mv .secrets.new .secrets.baseline
            echo "Created initial secrets baseline"
          fi


concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
